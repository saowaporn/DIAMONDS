<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta content="width=device-width, initial-scale=1.0" name="viewport">
  <title>Diamond Summary</title>

  <link href="../assets/img/favicon.png" rel="icon">
  <link href="../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
  <link href="../assets/css/main.css" rel="stylesheet">

  <style>
    .summary-wrap {
      max-width: 1000px;
      margin: 0 auto;
      padding: 24px 12px 40px;
    }

    .summary-hero {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 18px;
      background: #fff;
      margin-bottom: 16px;
    }

    .summary-title {
      font-family: "Playfair Display", serif;
      font-size: 1.7rem;
      margin: 0;
    }

    .summary-sub {
      color: #666;
      margin-top: 6px;
      font-size: 14px;
    }

    .summary-image {
      width: 100%;
      max-height: 360px;
      object-fit: contain;
      border: 1px solid #eee;
      border-radius: 10px;
      background: #fafafa;
      padding: 10px;
    }

    .summary-card {
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fff;
      padding: 14px;
      margin-bottom: 12px;
    }

    .summary-card h3 {
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      margin-bottom: 10px;
    }

    .summary-table {
      width: 100%;
      border-collapse: collapse;
    }

    .summary-table td {
      border-top: 1px solid #efefef;
      padding: 8px 2px;
      vertical-align: top;
      font-size: 14px;
    }

    .summary-table tr:first-child td {
      border-top: 0;
    }

    .summary-key {
      width: 40%;
      color: #666;
    }

    .summary-value {
      color: #111;
      font-weight: 500;
      word-break: break-word;
    }

    .summary-raw {
      margin-top: 12px;
      font-size: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      background: #fafafa;
      padding: 10px;
      max-height: 280px;
      overflow: auto;
      white-space: pre-wrap;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <main class="main">
    <div class="summary-wrap">
      <div class="summary-hero">
        <h1 id="summary_title" class="summary-title">Diamond Summary</h1>
        <div id="summary_sub" class="summary-sub">API data overview</div>
      </div>

      <div class="row g-3">
        <div class="col-lg-5">
          <img id="summary_image" class="summary-image" src="../assets/img/favicon.png" alt="Diamond image">
          <div class="d-grid mt-3">
            <a href="EngagementRing.html" class="btn btn-outline-dark">Back to Diamond List</a>
          </div>
        </div>

        <div class="col-lg-7">
          <div class="summary-card">
            <h3>General</h3>
            <table class="summary-table">
              <tbody id="general_body"></tbody>
            </table>
          </div>

          <div class="summary-card" id="quality_card" hidden>
            <h3>Quality</h3>
            <table class="summary-table">
              <tbody id="quality_body"></tbody>
            </table>
          </div>

          <div class="summary-card" id="details_card" hidden>
            <h3>Details</h3>
            <table class="summary-table">
              <tbody id="details_body"></tbody>
            </table>
          </div>

          <div class="summary-card" id="notes_card" hidden>
            <h3>Notes</h3>
            <table class="summary-table">
              <tbody id="notes_body"></tbody>
            </table>
          </div>

          <div class="summary-card" id="certificate_card" hidden>
            <h3>Certificate</h3>
            <table class="summary-table">
              <tbody id="certificate_body"></tbody>
            </table>
            <a id="summary_cert_link" class="btn btn-sm btn-outline-dark mt-2" target="_blank" rel="noopener noreferrer" hidden>
              Open Certificate Link
            </a>
          </div>

          <details class="summary-card mb-0">
            <summary>Full API Payload</summary>
            <pre id="summary_raw" class="summary-raw"></pre>
          </details>
        </div>
      </div>
    </div>
  </main>

  <script>
    function renderTableRows(tbodyId, dataObj) {
      const tbody = document.getElementById(tbodyId);
      if (!tbody) return 0;
      tbody.innerHTML = '';

      if (!dataObj || typeof dataObj !== 'object') {
        return 0;
      }

      const entries = Object.entries(dataObj).filter(([, value]) => {
        return value !== null && value !== undefined && String(value).trim() !== '';
      });

      const fragment = document.createDocumentFragment();
      entries.forEach(([key, value]) => {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td class="summary-key">${key}</td><td class="summary-value">${String(value)}</td>`;
        fragment.appendChild(tr);
      });
      tbody.appendChild(fragment);

      return entries.length;
    }

    document.addEventListener('DOMContentLoaded', () => {
      const apiData = JSON.parse(localStorage.getItem('selectedDiamondApiData') || localStorage.getItem('selectedDiamondApiDataForSettingSummary') || 'null');

      if (!apiData) {
        document.getElementById('summary_title').textContent = 'No Diamond Data Found';
        document.getElementById('summary_sub').textContent = 'Please select a diamond from Engagement page first.';
        return;
      }

      const title = `${apiData.carat || '-'} Carat ${String(apiData.shape || 'Diamond').toUpperCase()} Diamond`;
      document.getElementById('summary_title').textContent = title;
      document.getElementById('summary_sub').textContent = `ID: ${apiData.id || '-'} | Price: THB ${Number(String(apiData.price || 0).replace(/,/g, '') || 0).toLocaleString('en-US', { maximumFractionDigits: 2 })}`;

      const image = apiData?.media?.image || '../assets/img/favicon.png';
      document.getElementById('summary_image').src = image;

      const generalRows = {
        id: apiData.id,
        shape: apiData.shape,
        carat: apiData.carat,
        color: apiData.color,
        clarity: apiData.clarity,
        cut: apiData.cut,
        price: apiData.price
      };
      renderTableRows('general_body', generalRows);

      const qualityCount = renderTableRows('quality_body', apiData.quality);
      const detailsCount = renderTableRows('details_body', apiData.details);
      const notesCount = renderTableRows('notes_body', apiData.notes);
      const certCount = renderTableRows('certificate_body', apiData.certificate);

      document.getElementById('quality_card').hidden = qualityCount === 0;
      document.getElementById('details_card').hidden = detailsCount === 0;
      document.getElementById('notes_card').hidden = notesCount === 0;
      document.getElementById('certificate_card').hidden = certCount === 0;

      const certUrl = apiData?.certificate?.certificate;
      const certLink = document.getElementById('summary_cert_link');
      if (certLink && typeof certUrl === 'string' && certUrl.trim()) {
        certLink.hidden = false;
        certLink.href = certUrl;
      }

      document.getElementById('summary_raw').textContent = JSON.stringify(apiData, null, 2);
    });
  </script>
</body>

</html>
