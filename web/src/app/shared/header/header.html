<header id="header" class="header">
  <!-- Top Bar -->
  <div class="top-bar py-1">
    <div class="container-fluid container-xl">
      <div class="row align-items-center">
        <div class="text-center">
          <div class="announcement-slider swiper init-swiper" #announcementSlider>
            <div class="swiper-wrapper">
              <div class="swiper-slide">Choose Your Diamond Create Your Perfect Ring</div>
              <div class="swiper-slide">Need help? Call us: (+66) 085 885 7888</div>
              <div class="swiper-slide">Yaniga Diamond</div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Main Header -->
  <div class="main-header">
    <div class="container-fluid container-xl">
      <div class="d-flex py-2 align-items-center justify-content-between">

        <!-- Logo -->
        <a routerLink="/" class="logo d-flex align-items-center">
          <img src="/assets/img/YANIGA Logo.png" alt="YANIGA DIAMONDS">
        </a>

        <!-- Nav -->
        <div class="header-nav">
          <div class="container-fluid container-xl">
            <div class="position-relative">
              <nav id="navmenu" class="navmenu">
                <ul>
                  <li><a routerLink="/jewelry/engagement-ring">ENGAGEMENT RINGS</a></li>
                  <li><a routerLink="/diamonds">DIAMONDS</a></li>
                  <li><a routerLink="/knowledge">LEARN</a></li>
                  <li><a routerLink="/contact">CONTACT US</a></li>
                </ul>
              </nav>
            </div>
          </div>
        </div>

        <!-- Actions -->
        <div class="header-actions d-flex align-items-center justify-content-end">
          <a routerLink="/favorites" class="header-icon-link" aria-label="Favorites" data-fly-target="favorites">
            <i class="bi bi-heart"></i>
            @if (favorites.count() > 0) {
              <span class="header-icon-badge">{{ favorites.count() }}</span>
            }
          </a>
          <a routerLink="/cart" class="header-icon-link" aria-label="Shopping bag" data-fly-target="bag">
            <i class="bi bi-bag"></i>
            @if (cart.count() > 0) {
              <span class="header-icon-badge">{{ cart.count() }}</span>
            }
          </a>
          <button type="button" class="header-icon-link" aria-label="Account"
            (click)="auth.isLoggedIn() ? router.navigateByUrl('/admin') : loginModal.open()">
            <i class="bi" [class.bi-person-check-fill]="auth.isLoggedIn()" [class.bi-person]="!auth.isLoggedIn()"></i>
          </button>
          <!-- Mobile Navigation Toggle -->
          <i class="mobile-nav-toggle d-xl-none bi bi-list me-0"></i>
        </div>
      </div>
    </div>
  </div>

  <app-login-modal #loginModal></app-login-modal>
</header>
